name: stitch_desktop_grid
description: A free-form desktop grid layout widget and app for Flutter. Organize files and folders on an infinite canvas with drag-and-drop, snap-to-grid, zoom, and pan features.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.0.0
  path: ^1.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

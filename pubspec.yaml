name: file_tile
description: A free-form desktop grid layout widget and app for Flutter. Organize files and folders on an infinite canvas with drag-and-drop, snap-to-grid, zoom, and pan features.
version: 0.1.2
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.0.0
  path: ^1.8.0
  super_clipboard: ^0.9.1
  super_drag_and_drop: ^0.9.1
  drift: ^2.35.0
  sqlite3: ^3.5.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  drift_dev: ^2.35.0
  build_runner: ^2.15.1

flutter:
  uses-material-design: true
